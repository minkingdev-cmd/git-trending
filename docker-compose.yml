# PostgreSQL 使用宿主机本地实例（local-debug 栈，localhost:5432，trust 认证），
# 不再通过 docker 启动 PG。容器内通过 host.docker.internal 访问宿主 PG。
# 注意：若宿主 pg_hba 对 docker 网段要求 md5 口令，容器连接需相应配置密码。

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["stack"]
    environment:
      DATABASE_URL: postgres://postgres@host.docker.internal:5432/ghtrending
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LANGUAGES: ${LANGUAGES:-}
      STATIC_DIR: /app/frontend/dist
    ports:
      - "8000:8000"
    command: ["ght-api"]

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["stack"]
    environment:
      DATABASE_URL: postgres://postgres@host.docker.internal:5432/ghtrending
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LANGUAGES: ${LANGUAGES:-}
      COLLECT_TIME: ${COLLECT_TIME:-09:00}
    # Default: single run then exit (k8s CronJob style)
    command: ["ght-collector", "--once"]
    restart: "no"

  # Long-running collector with daily schedule (optional)
  collector-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["daemon"]
    environment:
      DATABASE_URL: postgres://postgres@host.docker.internal:5432/ghtrending
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LANGUAGES: ${LANGUAGES:-}
      COLLECT_TIME: ${COLLECT_TIME:-09:00}
    command: ["ght-collector"]
    restart: unless-stopped
