services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ght
      POSTGRES_PASSWORD: ght
      POSTGRES_DB: ghtrending
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ght"]
      interval: 2s
      timeout: 2s
      retries: 10
volumes:
  pgdata:
