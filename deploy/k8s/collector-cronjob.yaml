apiVersion: batch/v1
kind: CronJob
metadata:
  name: ght-collector
spec:
  # Daily at 01:00 UTC (adjust for COLLECT_TIME / timezone)
  schedule: "0 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: collector
              image: gh-trending:latest
              imagePullPolicy: IfNotPresent
              command: ["ght-collector", "--once"]
              envFrom:
                - secretRef:
                    name: ght-secrets
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
