apiVersion: apps/v1
kind: Deployment
metadata:
  name: ght-api
  labels:
    app: ght-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ght-api
  template:
    metadata:
      labels:
        app: ght-api
    spec:
      containers:
        - name: api
          image: gh-trending:latest
          imagePullPolicy: IfNotPresent
          command: ["ght-api"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ght-secrets
          env:
            - name: STATIC_DIR
              value: /app/frontend/dist
            - name: COOKIE_SECURE
              value: "true"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ght-api
spec:
  selector:
    app: ght-api
  ports:
    - port: 80
      targetPort: 8000
