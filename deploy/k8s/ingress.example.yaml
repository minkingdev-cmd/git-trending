# Example Ingress (nginx). Adjust host and TLS secret for your cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ght-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gh-trending.example.com
      secretName: ght-tls
  rules:
    - host: gh-trending.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ght-api
                port:
                  number: 80
